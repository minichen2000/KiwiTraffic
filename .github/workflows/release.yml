name: Release

# Release is triggered *only* by pushing a version tag - never by a normal push.
# The build runs in the cloud; no China mirrors are configured here on purpose,
# because the runners sit outside the mainland network and use the default feeds.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify the tag and collect release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = '${{ github.ref_name }}' -replace '^v', ''

          # XPath rather than property access: Directory.Build.props has several
          # PropertyGroup elements and only one of them holds <Version>.
          $props = [xml](Get-Content -Raw Directory.Build.props)
          $node = $props.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $node) { throw 'No <Version> element in Directory.Build.props' }

          $version = $node.InnerText.Trim()
          if ($tag -ne $version) {
            throw "Tag v$tag does not match <Version>$version</Version> in Directory.Build.props"
          }

          # The release body is the matching CHANGELOG section, so the curated
          # notes are the ones people read.
          $changelog = Get-Content -Raw CHANGELOG.md
          $match = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)")
          if (-not $match.Success) {
            throw "CHANGELOG.md has no section for [$version]"
          }

          Set-Content -Path release-notes.md -Value $match.Value -Encoding utf8NoBOM
          Write-Host "Releasing v$version"

      # The script runs the tests and publishes the single-file EXE.
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/KiwiTraffic.exe
          body_path: release-notes.md
